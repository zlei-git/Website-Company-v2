# Railway Nixpacks Configuration for Laravel 12 on PHP 8.4
[variables]
NIXPACKS_PHP_VERSION = '8.4'

[phases.setup]
nixPkgs = [
    'php84',
    'php84Extensions.pdo_mysql',
    'php84Extensions.sqlite3',
    'php84Extensions.pdo_sqlite',
    'php84Extensions.zip',
    'php84Extensions.gd',
    'php84Extensions.mbstring',
    'php84Packages.composer',
    'nodejs_22'
]

[phases.install]
cmds = [
    'composer install --ignore-platform-reqs --no-dev --optimize-autoloader --no-interaction',
    'npm install'
]

[phases.build]
cmds = [
    'npm run build'
]

[start]
cmd = 'php artisan storage:link || true; php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
