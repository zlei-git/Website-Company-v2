# Railway Nixpacks Configuration for Laravel 12
[phases.setup]
nixPkgs = [
    'php83',
    'php83Extensions.pdo_mysql',
    'php83Extensions.sqlite3',
    'php83Extensions.pdo_sqlite',
    'php83Extensions.zip',
    'php83Extensions.gd',
    'php83Extensions.mbstring',
    'php83Packages.composer',
    'nodejs_22'
]

[phases.install]
cmds = [
    'composer install --ignore-platform-reqs --no-dev --optimize-autoloader --no-interaction',
    'npm install'
]

[phases.build]
cmds = [
    'npm run build'
]

[start]
cmd = 'php artisan storage:link || true; php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
